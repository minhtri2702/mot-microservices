spring.application.name=product-services

# ============================================
# Database Configuration - mot_db (port 5432)
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/mot_db
spring.datasource.username=mot_admin
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================
# Crawler DB Configuration (for ETL)
# ============================================
crawler.datasource.url=jdbc:postgresql://localhost:5433/crawler_db
crawler.datasource.username=crawler_admin
crawler.datasource.password=0000
crawler.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# Server Configuration
# ============================================
server.port=8080

# ============================================
# Image Upload
# ============================================
app.upload.dir=./data
app.base-url=http://localhost:8080
