spring:
  application:
    name: product-services

  profiles:
    active: local

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://100.94.58.103:5432/mot_db
    username: mot_admin
    password: "0000"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 5000
      leak-detection-threshold: 30000
      connection-test-query: SELECT 1
      validation-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        hibernate:
          jdbc:
            batch_size: 20

minio:
  endpoint: http://100.94.58.103:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: manga-images

server:
  port: 8081

