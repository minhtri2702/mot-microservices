spring:
  application:
    name: product-services

  profiles:
    active: local

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://100.94.58.103:5432/mot_db
    username: mot_admin
    password: "0000"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

minio:
  endpoint: http://100.94.58.103:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: manga-images

server:
  port: 8081

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://mot-postgres:5432/mot_db
    username: mot_admin
    password: "0000"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

minio:
  endpoint: http://100.94.58.103:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: manga-images

server:
  port: 8080
