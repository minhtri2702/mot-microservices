name: Build Backend Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: mot_db
          POSTGRES_USER: mot_admin
          POSTGRES_PASSWORD: "0000"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mot_admin -d mot_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test Maven modules
        env:
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
          MOT_APP_JWTSECRET: dGVzdC1vbmx5LWp3dC1zZWNyZXQtMzItYnl0ZXMtbG9uZw==
        run: ./mvnw -B test

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: account-service
            dockerfile: account-service/Dockerfile
            image: mot-account-service
          - service: product-services
            dockerfile: product-services/Dockerfile
            image: mot-product-services
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/minhtri2702/${{ matrix.image }}:latest
            ghcr.io/minhtri2702/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
